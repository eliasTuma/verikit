# Promises this repo verifies. Read by verikit: python verification/verikit.py run
version = 1

[[check]]
id = "checkout-dotnet"
rule = "A customer is never charged twice for one purchase."
harm = "The customer pays twice for one order: refunds, chargebacks, lost trust."
level = "code"
tool = "FsCheck + xUnit: generated event orderings on the real CheckoutSession (net8.0 and net48)"
tags = ["payments"]
run = "dotnet test tests/Checkout.Tests --filter Category=Verification"
covers = ["src/Checkout/**/*.cs"]
bounds = "500 generated schedules per target framework, maxRetries 0..3; sampling, not exhaustive"
assumes = ["The provider charges at most once per idempotency key (the fake models this)."]
timeout = 900
synced_commit = ""

  [[check.must_fail]]
  why = "Broken variant: the idempotency key is built per attempt"
  patch = "verification/checkout/mutants/key-per-attempt.patch"
  match = 'customer charged [2-9] times'
