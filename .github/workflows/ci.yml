# CI for the verikit kit itself: unit tests, the monorepo end-to-end test, and every example.
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v

  ci-templates:   # the GitHub and Azure templates, as `init --ci` writes them
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.2 jsonschema==4.23.0
      - run: python scripts/check_ci_templates.py
      - name: actionlint (expressions and contexts in the GitHub workflows)
        run: |
          mkdir -p /tmp/lint/.github/workflows
          python -c "import sys; sys.path.insert(0, '.'); import verikit, pathlib; t = pathlib.Path('templates/ci/github-actions.yml').read_text(); pathlib.Path('/tmp/lint/.github/workflows/verify.yml').write_text(verikit.set_ci_roots(t, ['services/api', 'web']))"
          cp .github/workflows/ci.yml /tmp/lint/.github/workflows/
          docker run --rm -v /tmp/lint:/repo -w /repo rhysd/actionlint:1.7.7 -color

  examples-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v4   # dotnet-coyote (net8.0) on Linux
        with:
          dotnet-version: "8.0.x"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/verikit
          key: verikit-tla-1.7.4
      # angular-testbed uses the runner's Google Chrome (headless)
      - run: python scripts/check_examples.py node-checkout react-pay-button angular-search-store angular-testbed dotnet-coyote
      - run: python scripts/e2e.py

  examples-windows:   # .NET Framework (net48) tests need Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      # legacy: Visual Studio's MSBuild + vstest found via vswhere
      - run: python scripts/check_examples.py dotnet-checkout dotnet-legacy dotnet-coyote
