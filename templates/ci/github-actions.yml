# verikit for GitHub Actions. On pull requests `run --ci` runs only the checks whose covered
# code changed vs the PR's base branch; on main it runs everything. Results are JUnit XML.
# One job per verification root (each folder that holds verification/). `verikit init --ci github`
# adds each new root to the list marked verikit:roots. Keep the setup steps your checks need.
name: verify
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        root: ["."]   # verikit:roots
    # windows-latest if any check runs .NET Framework (net4x) tests; ubuntu-latest otherwise
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.root }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # --ci and stale need history back to the base and sync commits
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4  # TLA+ checks
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@v4       # verikit downloads a pinned, checksummed tla2tools.jar once
        with:
          path: ~/.cache/verikit
          key: verikit-tla-1.7.4
      - uses: actions/setup-dotnet@v4  # .NET checks
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-node@v4    # Node / React / Angular checks
        with:
          node-version: 22
      # - run: npm ci                  # install each JS project a check runs in
      #   working-directory: ${{ matrix.root }}/web
      - name: verikit run
        run: python verification/verikit.py run --ci --junit verify-results.xml
      - name: verikit stale
        if: always()
        run: python verification/verikit.py stale   # add --strict to fail the build on drift
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-results-${{ strategy.job-index }}
          path: ${{ matrix.root }}/verify-results.xml
          if-no-files-found: ignore
